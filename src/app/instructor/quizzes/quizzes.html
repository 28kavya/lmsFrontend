<div class="container mt-4">

  <div class="card shadow">

    <div class="card-header bg-dark text-white">
      <h3>Create Quiz</h3>
    </div>

    <div class="card-body">

      <div class="row">

        <!-- Course -->
        <div class="col-md-12 mb-3">

          <label class="form-label">Course</label>

          <select
            class="form-select"
            [(ngModel)]="selectedCourse"
            (change)="onCourseChange()">

            <option value="0">Select Course</option>

            @for(course of courses; track course.id){

            <option [value]="course.id">

              {{course.title}}

            </option>

            }

          </select>

        </div>
        <!--quiz title-->
        <div class="mb-3">
  <label class="form-label">Quiz Title</label>
  <input
    type="text"
    class="form-control"
    placeholder="Enter Quiz Title"
    [(ngModel)]="quizTitle"
    name="quizTitle">
</div>

        <!-- Lesson -->
        <div class="col-md-6 mb-3">

          <label class="form-label">Lesson</label>

          <select
            class="form-select"
            [(ngModel)]="selectedLesson">

            <option value="0">

              Select Lesson

            </option>

            @for(lesson of lessons; track lesson.id){

            <option [value]="lesson.id">

              {{lesson.title}}

            </option>

            }

          </select>

        </div>

        <!-- Question -->
        <div class="col-md-6 mb-3">

          <label class="form-label">Question</label>

          <input
            class="form-control"
            [(ngModel)]="question">

        </div>

        <!-- Option A -->
        <div class="col-md-6 mb-3">

          <label class="form-label">Option A</label>

          <input
            class="form-control"
            [(ngModel)]="optionA">

        </div>

        <!-- Option B -->
        <div class="col-md-6 mb-3">

          <label class="form-label">Option B</label>

          <input
            class="form-control"
            [(ngModel)]="optionB">

        </div>

        <!-- Option C -->
        <div class="col-md-6 mb-3">

          <label class="form-label">Option C</label>

          <input
            class="form-control"
            [(ngModel)]="optionC">

        </div>

        <!-- Option D -->
        <div class="col-md-6 mb-3">

          <label class="form-label">Option D</label>

          <input
            class="form-control"
            [(ngModel)]="optionD">

        </div>

        <!-- Correct Answer -->
        <div class="col-md-6 mb-3">

          <label class="form-label">

            Correct Answer

          </label>

          <select
            class="form-select"
            [(ngModel)]="correctAnswer">

            <option value="">Choose</option>

            <option [value]="optionA">{{optionA}}</option>

            <option [value]="optionB">{{optionB}}</option>

            <option [value]="optionC">{{optionC}}</option>

            <option [value]="optionD">{{optionD}}</option>

          </select>

        </div>

      </div>

      <div class="text-end">

        <button
          type="button"
          class="btn btn-primary me-2"
          (click)="addQuestion()">

          + Add Question

        </button>

        <button
          type="button"
          class="btn btn-success"
          (click)="submitQuiz()">

          Submit Quiz

        </button>

      </div>

    </div>

  </div>

  <!-- Added Questions -->

  <div class="card mt-4 shadow" *ngIf="quizList.length>0">

    <div class="card-header bg-primary text-white">

      <h4>Questions Added</h4>

    </div>

    <div class="card-body">

      @for(question of quizList; track $index; let i = $index){

      <div class="card mb-3">

        <div class="card-body">

         <h5>

Q{{i+1}}. {{question.questionText}}

</h5>

          <p><b>A.</b> {{question.optionA}}</p>

          <p><b>B.</b> {{question.optionB}}</p>

          <p><b>C.</b> {{question.optionC}}</p>

          <p><b>D.</b> {{question.optionD}}</p>

          <span class="badge bg-success">

          ✔ {{question.correctAnswer}}

          </span>

          <div class="text-end mt-3">

            <button
              class="btn btn-warning btn-sm me-2"
              (click)="editQuestion(i )">

              Edit

            </button>

            <button
              class="btn btn-danger btn-sm"
              (click)="deleteQuestion(i)">

              Delete

            </button>

          </div>

        </div>

      </div>

      }

    </div>

  </div>

</div>
