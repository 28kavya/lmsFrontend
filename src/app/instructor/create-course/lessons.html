<div class="container mt-4">
  <div class="card p-4">
    <div class="col-md-6 mb-3">
      <label>SELECT COURSE</label>
      <select class="form-select" [(ngModel)]="selectedCourseId" name="course">
        <option [ngValue]="null">Select Course</option>

        <option *ngFor="let c of course" [ngValue]="c.id">{{ c.title }}</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Lesson Name</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="lessonName"
        placeholder="Lesson Name"
      />
    </div>

    <div class="mb-3">
      <label class="form-label">Video URL / iframe</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="videoUrl"
        placeholder="Paste YouTube embed URL or iframe"
      />
    </div>

    <!-- IMPORTANT -->
    <button class="btn btn-primary" (click)="addLesson()">Add Lesson</button>

    <hr />

    <!-- Display Lessons -->
    @for (lesson of lessons; track $index; let i = $index) {
    <div class="card p-3 mb-4 shadow lesson-card" [id]="'lesson-' + i">
      <div class="d-flex justify-content-between align-items-center">
        <h4>{{ lesson.title }}</h4>

        <div>
          <button
            class="btn btn-secondary btn-sm me-2"
            (click)="previousLesson(i)"
            [disabled]="i === 0"
          >
            Previous
          </button>

          <button class="btn btn-danger btn-sm" (click)="deleteLesson(i)">
            Delete
          </button>
        </div>
      </div>

      <h6>{{ lesson.lessonName }}</h6>

      <iframe
        width="100%"
        height="350"
        [src]="lesson.video"
        frameborder="0"
        allowfullscreen
      >
      </iframe>
    </div>

    }
    <div class="text-end mt-4 mb-4">
      <button class="btn btn-success px-4" (click)="createLessons()">
        <i class="bi bi-check-circle me-2"></i>
        Create Lessons
      </button>
    </div>
  </div>
</div>
