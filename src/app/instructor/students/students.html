<div class="container mt-4">

    <h2 class="text-center mb-4 fw-bold">
        Student Management
    </h2>

    <!-- Search -->

    <div class="row justify-content-center mb-4">

        <div class="col-md-6">

            <input
  type="text"
  class="form-control"
  placeholder="Search student..."
  [(ngModel)]="searchText"
  (input)="searchStudent()">
        </div>

    </div>

    
    <!-- Student Table -->

   <div class="card-header text-white" style="background-color: #e27107;">
    <h5 class="mb-0">
        Student Details
    </h5>
</div>
        <div class="table-responsive">

            <table class="table table-hover mb-0">

                <thead class="table-light">

                    <tr>

                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Status</th>

                    </tr>

                </thead>
<tbody>

<tr *ngFor="let student of filteredStudents">

    <td>{{student.name}}</td>

    <td>{{student.email}}</td>

    <td>{{student.course}}</td>

    <td>{{student.status}}</td>

</tr>

</tbody>
</table>
