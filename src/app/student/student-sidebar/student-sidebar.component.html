<div class="sidebar">

    <!-- Logo -->

    <div class="logo">

        <i class="bi bi-mortarboard-fill"></i>

        <span>LearnHub</span>

    </div>

    <!-- Menu -->

    <ul class="menu">

        <li routerLink="/student/dashboard"
            routerLinkActive="active">

            <i class="bi bi-grid-fill"></i>

            <span>Dashboard</span>

        </li>

        <li routerLink="/student/explore-courses"
            routerLinkActive="active">

            <i class="bi bi-search"></i>

            <span>Explore Courses</span>

        </li>

        <li routerLink="/student/my-courses"
            routerLinkActive="active">

            <i class="bi bi-book-fill"></i>

            <span>My Courses</span>

        </li>

        <li routerLink="/student/quiz/:lessonId"
            routerLinkActive="active">

            <i class="bi bi-patch-question-fill"></i>

            <span>Quizzes</span>

        </li>

        <li routerLink="/student/certificates"
            routerLinkActive="active">

            <i class="bi bi-award-fill"></i>

            <span>Certificates</span>

        </li>
        
        <li routerLink="/student/settings"
            routerLinkActive="active">

            <i class="bi bi-gear-fill"></i>

            <span>Settings</span>

        </li>
        <li>
            <i class="logout-btn bi bi-box-arrow-right" (click)="loginService.logout()">
                <span>Logout</span>
            </i>
        </li>
    </ul>

</div>
