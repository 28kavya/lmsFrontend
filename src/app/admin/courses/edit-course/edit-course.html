<div class="edit-course-page">
  <!-- Header -->
  <div class="page-header">
    <div>
      <h2>Edit Course</h2>
      <p>Dashboard / Courses / <span>Edit Course</span></p>
    </div>

    <button class="btn btn-secondary back-btn" routerLink="/admin/courses">
      <i class="fas fa-arrow-left"></i>
      Back
    </button>
  </div>

  <!-- Form Card -->
  <div class="card course-card">
    <div class="card-header">
      <h4>
        <i class="fas fa-pen"></i>

        Update Course Details
      </h4>
    </div>

    <div class="card-body">
      <form (ngSubmit)="updateCourse()">
        <div class="row">
          <!-- Course Name -->
          <div class="col-md-6 mb-4">
            <label>Course Name</label>

            <input
              type="text"
              class="form-control"
              [(ngModel)]="course.title"
              name="title"
            />
          </div>

          <!-- Instructor -->
          <div class="col-md-6 mb-4">
            <label>Instructor</label>

            <select
              class="form-control"
              [(ngModel)]="course.instructor"
              name="instructorId"
            >
              <option [ngValue]="0" disabled>Select Instructor</option>

              <option
                *ngFor="let instructor of insturctorList"
                [ngValue]="instructor.name"
              >
                {{ instructor.name }}
              </option>
            </select>
          </div>

          <!-- Price -->
          <div class="col-md-6 mb-4">
            <label>Price</label>

            <input
              type="number"
              class="form-control"
              [(ngModel)]="course.price"
              name="price"
            />
          </div>
          <!-- Image -->
          <!-- <div class="col-12 mb-4">

            <label>Course Image URL</label>

            <input
              type="text"
              class="form-control"
              [(ngModel)]="course.image"
              name="image">

          </div> -->

          <!-- Description -->
          <div class="col-12 mb-4">
            <label>Description</label>

            <textarea
              rows="6"
              class="form-control"
              [(ngModel)]="course.description"
              name="description"
            ></textarea>
          </div>
        </div>

        <!-- Buttons -->
        <div class="form-buttons">
          <button
            type="button"
            class="btn btn-light cancel-btn"
            (click)="cancel()"
          >
            Cancel
          </button>

          <button type="submit" class="btn save-btn">
            <i class="fas fa-save"></i>

            Update Course
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
