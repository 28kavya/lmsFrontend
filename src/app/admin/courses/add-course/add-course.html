<div class="add-course-page">

    <!-- Header -->

    <div class="page-header">

        <div>
            <h2>Add New Course</h2>
            <p>Dashboard / Courses / <strong>Add Course</strong></p>
        </div>

    </div>

    <!-- Form Card -->

    <div class="card form-card">

        <div class="card-body">

            <div class="container mt-4">

    <h2>Add Course</h2>

    <div class="mb-3">

        <label>Course Name</label>

        <input
        type="text"
        class="form-control"
        [(ngModel)]="course.title">

    </div>

    <div class="mb-3">

        <label>Description</label>

        <textarea
        class="form-control"
        rows="5"
        [(ngModel)]="course.description"></textarea>

    </div>

    <div class="mb-3">

        <label>Price</label>

        <input
        type="number"
        class="form-control"
        [(ngModel)]="course.price">

    </div>

    <div class="mb-3">

        <label>Instructor</label>

        <select
        class="form-control"
        [(ngModel)]="course.instructorId">

            <option value="0">Select Instructor</option>

            <option
            *ngFor="let instructor of instructors"
            [ngValue]="instructor.id">

                {{ instructor.name }}

            </option>

        </select>

    </div>

    <button
    class="btn btn-primary"
    (click)="saveCourse()">

        Save Course

    </button>

</div>

        </div>

    </div>

</div>
