<div class="add-course-page">

    <!-- Header -->

    <div class="page-header">

        <div>
            <h2>Add New Course</h2>
            <p>Dashboard / Courses / <strong>Add Course</strong></p>
        </div>

    </div>

    <!-- Form Card -->

    <div class="card form-card">

        <div class="card-body">

            <form #courseForm="ngForm" (ngSubmit)="saveCourse()">

                <div class="row">

                    <!-- Course Name -->

                    <div class="col-md-6 mb-4">

                        <label class="form-label">
                            Course Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Enter course name"
                            [(ngModel)]="course.title"
                            name="title"
                            required>

                    </div>

                    <!-- Instructor -->

                    <div class="col-md-6 mb-4">

                        <label class="form-label">
                            Instructor
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Instructor Name"
                            [(ngModel)]="course.instructor"
                            name="instructor">

                    </div>

                    

                    <!-- Price -->

                    <div class="col-md-6 mb-4">

                        <label class="form-label">
                            Price
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            placeholder="Course Price"
                            [(ngModel)]="course.price"
                            name="price">

                    </div>

                    <!-- Students -->

                    <div class="col-md-6 mb-4">

                        <label class="form-label">
                            Maximum Students
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            placeholder="Students"
                            [(ngModel)]="course.students"
                            name="students">

                    </div>

                    <!-- Image -->

                    <div class="col-md-12 mb-4">

                        <label class="form-label">
                            Course Image URL
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Paste Image URL"
                            [(ngModel)]="course.image"
                            name="image">

                    </div>

                    <!-- Description -->

                    <div class="col-md-12 mb-4">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            rows="5"
                            class="form-control"
                            placeholder="Course Description"
                            [(ngModel)]="course.description"
                            name="description"></textarea>

                    </div>

                </div>

                <div class="text-end">

                    <button
                        class="btn btn-primary px-5"
                        type="submit">

                        <i class="bi bi-check-circle-fill me-2"></i>

                        Save Course

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
