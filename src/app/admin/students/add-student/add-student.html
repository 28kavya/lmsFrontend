<div class="add-student-page">

  <!-- Header -->

  <div class="page-header">

    <div>

      <h2>Add Student</h2>

      <p>

        Dashboard /

        Students /

        <strong>Add Student</strong>

      </p>

    </div>

  </div>

  <!-- Form -->

  <div class="card form-card">

    <div class="card-body">

      <form
        #studentForm="ngForm"
        (ngSubmit)="saveStudent()">

        <div class="row">

          <!-- Name -->

          <div class="col-md-6 mb-4">

            <label class="form-label">

              Student Name

            </label>

            <input
              type="text"
              class="form-control"
              placeholder="Enter Student Name"
              [(ngModel)]="student.name"
              name="name"
              required>

          </div>

          <!-- Email -->

          <div class="col-md-6 mb-4">

            <label class="form-label">

              Email

            </label>

            <input
              type="email"
              class="form-control"
              placeholder="Enter Email"
              [(ngModel)]="student.email"
              name="email"
              required>

          </div>

          <!-- Course -->

          <div class="col-md-6 mb-4">

            <label class="form-label">

              Course

            </label>

            <select
              class="form-select"
              [(ngModel)]="student.course"
              name="course">

              <option value="">Select Course</option>

              <option>Java Full Stack</option>

              <option>Angular</option>

              <option>Spring Boot</option>

              <option>MySQL</option>

            </select>

          </div>

          <!-- Phone -->

          <div class="col-md-6 mb-4">

            <label class="form-label">

              Phone Number

            </label>

            <input
              type="text"
              class="form-control"
              placeholder="Enter Phone Number"
              [(ngModel)]="student.phone"
              name="phone">

          </div>

          <!-- Status -->

          <div class="col-md-6 mb-4">

            <label class="form-label">

              Status

            </label>

            <select
              class="form-select"
              [(ngModel)]="student.status"
              name="status">

              <option>Active</option>

              <option>Completed</option>

            </select>

          </div>

          <!-- Image -->

          <div class="col-md-6 mb-4">

            <label class="form-label">

              Profile Image URL

            </label>

            <input
              type="text"
              class="form-control"
              placeholder="Paste Image URL"
              [(ngModel)]="student.image"
              name="image">

          </div>

        </div>

        <!-- Buttons -->

        <div class="text-end">

          <button
            type="submit"
            class="btn btn-primary px-5">

            <i class="bi bi-check-circle-fill me-2"></i>

            Save Student

          </button>

        </div>

      </form>

    </div>

  </div>

</div>
