<div class="edit-student-page">

  <div class="page-header">

    <div>

      <h2>Edit Student</h2>

      <p>
        Dashboard /
        Students /
        <strong>Edit Student</strong>
      </p>

    </div>

    <button
      class="btn btn-secondary"
      (click)="cancel()">

      Back

    </button>

  </div>

  <div class="card form-card">

    <div class="card-body">

      <form (ngSubmit)="updateStudent()">

        <div class="row">

          <div class="col-md-6 mb-4">

            <label class="form-label">

              Student Name

            </label>

            <input
              type="text"
              class="form-control"
              [(ngModel)]="student.name"
              name="name">

          </div>

          <div class="col-md-6 mb-4">

            <label class="form-label">

              Email

            </label>

            <input
              type="email"
              class="form-control"
              [(ngModel)]="student.email"
              name="email">

          </div>

          <div class="col-md-6 mb-4">

            <label class="form-label">

              Course

            </label>

            <select
              class="form-select"
              [(ngModel)]="student.course"
              name="course">

              <option>Java Full Stack</option>

              <option>Angular</option>

              <option>Spring Boot</option>

              <option>MySQL</option>

            </select>

          </div>

          <div class="col-md-6 mb-4">

            <label class="form-label">

              Phone

            </label>

            <input
              type="text"
              class="form-control"
              [(ngModel)]="student.phone"
              name="phone">

          </div>

          <div class="col-md-6 mb-4">

            <label class="form-label">

              Status

            </label>

            <select
              class="form-select"
              [(ngModel)]="student.status"
              name="status">

              <option>Active</option>

              <option>Completed</option>

            </select>

          </div>

          <div class="col-md-6 mb-4">

            <label class="form-label">

              Profile Image URL

            </label>

            <input
              type="text"
              class="form-control"
              [(ngModel)]="student.image"
              name="image">

          </div>

        </div>

        <div class="text-end">

          <button
            type="button"
            class="btn btn-light me-3"
            (click)="cancel()">

            Cancel

          </button>

          <button
            type="submit"
            class="btn btn-primary">

            Update Student

          </button>

        </div>

      </form>

    </div>

  </div>

</div>
