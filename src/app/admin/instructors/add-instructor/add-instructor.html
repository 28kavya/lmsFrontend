<div class="container mt-5">

<div class="card">

<div class="card-header">

<h3>Add Instructor</h3>

</div>

<div class="card-body">

<div class="mb-3">

<label>Name</label>

<input
type="text"
class="form-control"
[(ngModel)]="instructor.name">

</div>


<div class="mb-3">

<label>Email</label>

<input
type="email"
class="form-control"
[(ngModel)]="instructor.email">

</div>


<div class="mb-3">

<label>Password</label>

<input
type="password"
class="form-control"
[(ngModel)]="instructor.password">

</div>

<button
class="btn btn-primary"
(click)="saveInstructor()">

Save Instructor

</button>

</div>

</div>

</div>
