<div class="edit-instructor-page">

  <div class="page-header">

    <div>
      <h2>Edit Instructor</h2>
      <p>
        Dashboard /
        Instructors /
        <strong>Edit Instructor</strong>
      </p>
    </div>

  </div>

  <div class="card form-card">

    <div class="card-body">

      <form (ngSubmit)="updateInstructor()">

        <div class="row">

          <!-- Name -->

          <div class="col-md-6 mb-4">

            <label class="form-label">
              Instructor Name
            </label>

            <input
              type="text"
              class="form-control"
              [(ngModel)]="instructor.name"
              name="name"
              required>

          </div>

          <!-- Designation -->

          <div class="col-md-6 mb-4">

            <label class="form-label">
              Designation
            </label>

            <input
              type="text"
              class="form-control"
              [(ngModel)]="instructor.designation"
              name="designation">

          </div>

          <!-- Email -->

          <div class="col-md-6 mb-4">

            <label class="form-label">
              Email
            </label>

            <input
              type="email"
              class="form-control"
              [(ngModel)]="instructor.email"
              name="email">

          </div>

          <!-- Department -->

          <div class="col-md-6 mb-4">

            <label class="form-label">
              Department
            </label>

            <select
              class="form-select"
              [(ngModel)]="instructor.department"
              name="department">

              <option>Programming</option>
              <option>Web Development</option>
              <option>Database</option>
              <option>Cloud</option>

            </select>

          </div>

          <!-- Courses -->

          <div class="col-md-6 mb-4">

            <label class="form-label">
              Courses
            </label>

            <input
              type="number"
              class="form-control"
              [(ngModel)]="instructor.courses"
              name="courses">

          </div>

          <!-- Students -->

          <div class="col-md-6 mb-4">

            <label class="form-label">
              Students
            </label>

            <input
              type="number"
              class="form-control"
              [(ngModel)]="instructor.students"
              name="students">

          </div>

          <!-- Image -->

          <div class="col-12 mb-4">

            <label class="form-label">
              Profile Image URL
            </label>

            <input
              type="text"
              class="form-control"
              [(ngModel)]="instructor.image"
              name="image">

          </div>

        </div>

        <div class="text-end">

          <button
            type="button"
            class="btn btn-secondary me-2"
            (click)="cancel()">

            Cancel

          </button>

          <button
            type="submit"
            class="btn btn-primary">

            Update Instructor

          </button>

        </div>

      </form>

    </div>

  </div>

</div>
